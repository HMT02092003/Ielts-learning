name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: ielts
          POSTGRES_PASSWORD: ielts_ci_password
          POSTGRES_DB: ielts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ielts" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ielts:ielts_ci_password@127.0.0.1:5432/ielts_test
      TEST_DATABASE_URL: postgresql://ielts:ielts_ci_password@127.0.0.1:5432/ielts_test
      JWT_ACCESS_SECRET: ci-only-secret-at-least-thirty-two-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn run check
