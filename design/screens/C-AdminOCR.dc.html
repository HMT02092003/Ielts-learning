<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>C · Duyệt OCR</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Lexend:wght@300;400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0;background:#F4F6F8}
a{color:#1F5E4B}a:hover{color:#123B2F}
a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #1F5E4B;outline-offset:2px}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; flex-direction: column; background: #F4F6F8; color: #13201C; font-family: 'Be Vietnam Pro', system-ui, sans-serif">

  <header style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E3E7EB; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 14px; min-width: 0">
      <span style="display: flex; align-items: center; gap: 8px; font-family: 'Lexend', sans-serif; font-size: 16px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #1F5E4B"></span>lặng</span>
      <span style="color: #C9D1D8">/</span><span style="font-size: 14px; color: #5B6670">Quản trị</span><span style="color: #C9D1D8">/</span>
      <span style="font-size: 14px; font-weight: 600">VOL3_Test5_Reading.pdf</span>
      <span style="height: 24px; padding: 0 8px; border-radius: 6px; background: #FBEBDD; color: #8A4418; font-size: 12px; font-weight: 600; display: flex; align-items: center">Chờ duyệt · 4 cảnh báo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Trang trước" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span style="font-size: 14px; padding: 0 6px">Trang <b>3</b> / 12</span>
      <button type="button" aria-label="Trang sau" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button type="button" style="height: 40px; padding: 0 14px; margin-left: 12px; border-radius: 10px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; font: inherit; font-size: 14px">Lưu nháp</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #1F5E4B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500">Duyệt trang này</button>
    </div>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap">
    <!-- Original image -->
    <section aria-label="Ảnh gốc" style="flex: 1 1 520px; min-width: 0; height: 100%; display: flex; flex-direction: column; border-right: 1px solid #E3E7EB">
      <div style="flex-shrink: 0; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #E3E7EB; background: #FFFFFF">
        <span style="font-size: 13px; font-weight: 600; margin-right: 8px">Ảnh gốc</span>
        <div role="group" aria-label="Thu phóng" style="display: flex; align-items: center; border: 1px solid #C9D1D8; border-radius: 10px; overflow: hidden">
          <button type="button" aria-label="Thu nhỏ" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; font: inherit; font-size: 16px; color: #13201C">−</button>
          <span style="padding: 0 8px; font-size: 13px; font-variant-numeric: tabular-nums">100%</span>
          <button type="button" aria-label="Phóng to" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; font: inherit; font-size: 16px; color: #13201C">+</button>
        </div>
        <button type="button" aria-label="Xoay 90 độ" style="width: 38px; height: 38px; border-radius: 10px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
        <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 38px"><input type="checkbox" checked style="margin: 0; width: 16px; height: 16px; accent-color: #1F5E4B"> Hiện vùng nhận dạng</label>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: 24px; display: flex; justify-content: center; background: #E9EDF0">
        <div role="img" aria-label="Ảnh scan trang 3 với 6 vùng nhận dạng" style="position: relative; width: 520px; height: 700px; flex-shrink: 0; background: #FCFCFA; box-shadow: 0 1px 2px rgba(19,32,28,0.1), 0 8px 24px -12px rgba(19,32,28,0.2)">
          <div style="position: absolute; left: 44px; top: 30px; font-size: 11px; color: #5B6670">[Ảnh scan trang gốc]</div>
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="40"><div style="position: absolute; left: {{l.x}}; top: {{l.y}}; width: {{l.w}}; height: 6px; border-radius: 2px; background: #C9CDD0"></div></sc-for>
          <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
            <div style="position: absolute; left: {{b.x}}; top: {{b.y}}; width: {{b.w}}; height: {{b.h}}; border: {{b.border}}; background: {{b.fill}}; border-radius: 3px">
              <span style="position: absolute; left: -1px; top: -20px; height: 18px; padding: 0 6px; border-radius: 4px 4px 0 0; background: {{b.chip}}; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{b.label}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- Editable text -->
    <section aria-label="Văn bản nhận dạng" style="flex: 1 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column; background: #FFFFFF">
      <div style="flex-shrink: 0; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #E3E7EB">
        <span style="font-size: 13px; font-weight: 600; margin-right: 8px">Gắn thẻ khối</span>
        <div role="radiogroup" aria-label="Loại nội dung" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
            <button type="button" role="radio" aria-checked="{{t.on}}" style="height: 36px; padding: 0 10px; border-radius: 8px; border: {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{t.dot}}"></span>{{t.label}}<kbd style="font-family: inherit; font-size: 11px; opacity: 0.7">{{t.key}}</kbd></button>
          </sc-for>
        </div>
        <div style="margin-left: auto; display: flex; gap: 6px">
          <button type="button" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; font: inherit; font-size: 13px">Gộp khối</button>
          <button type="button" style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #C9D1D8; background: #FFFFFF; color: #13201C; font: inherit; font-size: 13px">Tách khối</button>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{blocks}}" as="k" hint-placeholder-count="6">
          <article style="border-radius: 12px; border: {{k.border}}; box-shadow: {{k.ring}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <span style="height: 24px; padding: 0 8px; border-radius: 6px; background: {{k.tagBg}}; color: {{k.tagFg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{k.dot}}"></span>{{k.tag}}</span>
              <span style="font-size: 12px; color: #5B6670">{{k.meta}}</span>
              <span style="margin-left: auto; font-size: 12px; font-weight: 600; color: {{k.confFg}}">{{k.conf}}</span>
            </div>
            <div contenteditable="true" role="textbox" aria-multiline="true" aria-label="{{k.aria}}" style="font-family: 'Newsreader', serif; font-size: 16px; line-height: 1.6; color: #13201C; padding: 8px 10px; border-radius: 8px; background: #F4F6F8; outline: none">{{k.before}}<span style="text-decoration: underline wavy #A8551F; text-underline-offset: 3px; background: {{k.flagBg}}">{{k.flag}}</span>{{k.after}}</div>
          </article>
        </sc-for>
      </div>
      <div style="flex-shrink: 0; padding: 12px 20px; border-top: 1px solid #E3E7EB; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 13px; color: #5B6670">
        <span><b style="color: #13201C">6</b> khối · <b style="color: #13201C">4</b> từ độ tin cậy thấp</span>
        <span style="margin-left: auto; display: flex; align-items: center; gap: 6px"><kbd style="padding: 1px 6px; border: 1px solid #C9D1D8; border-radius: 4px; font-family: inherit; font-size: 11px">J</kbd>/<kbd style="padding: 1px 6px; border: 1px solid #C9D1D8; border-radius: 4px; font-family: inherit; font-size: 11px">K</kbd> chuyển khối · <kbd style="padding: 1px 6px; border: 1px solid #C9D1D8; border-radius: 4px; font-family: inherit; font-size: 11px">N</kbd> cảnh báo tiếp theo</span>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      P: { label: 'Bài đọc', dot: '#1F5E4B', bg: '#E3EFEA', fg: '#1F5E4B', key: 'P' },
      Q: { label: 'Câu hỏi', dot: '#1E4E8C', bg: '#E4ECF7', fg: '#1E4E8C', key: 'Q' },
      A: { label: 'Đáp án', dot: '#A8551F', bg: '#FBEBDD', fg: '#8A4418', key: 'A' },
      I: { label: 'Hướng dẫn', dot: '#5B6670', bg: '#EEF1F3', fg: '#3B464F', key: 'I' },
      X: { label: 'Bỏ qua', dot: '#9AA3AA', bg: '#FFFFFF', fg: '#5B6670', key: 'X' }
    };
    const selected = 'Q';
    const tags = ['P', 'Q', 'A', 'I', 'X'].map(k => ({ ...T[k], on: k === selected ? 'true' : 'false',
      border: k === selected ? '2px solid ' + T[k].dot : '1px solid #E3E7EB', bg: k === selected ? T[k].bg : '#FFFFFF' }));
    const lines = [];
    const rows = [[62, 2, 380], [106, 8, 420], [218, 6, 420], [378, 4, 420], [522, 7, 420]];
    rows.forEach(([y0, n, w]) => { for (let i = 0; i < n; i++) lines.push({ x: '44px', y: (y0 + i * 14) + 'px', w: (i === n - 1 ? w * 0.6 : w) + 'px' }); });
    const box = (x, y, w, h, k, label, sel) => ({ x: x + 'px', y: y + 'px', w: w + 'px', h: h + 'px', label,
      border: (sel ? '2px solid ' : '1.5px solid ') + T[k].dot, fill: sel ? 'rgba(30,78,140,0.10)' : 'transparent', chip: T[k].dot });
    const boxes = [
      box(36, 54, 400, 30, 'I', 'Hướng dẫn'),
      box(36, 98, 444, 110, 'P', 'Bài đọc · đoạn A–C'),
      box(36, 212, 444, 82, 'P', 'Bài đọc · đoạn D–F'),
      box(36, 370, 444, 60, 'Q', 'Câu hỏi 1–5', true),
      box(36, 514, 444, 100, 'Q', 'Câu hỏi 6–10'),
      box(380, 650, 100, 28, 'X', 'Số trang')
    ];
    const blk = (k, meta, conf, before, flag, after, sel) => ({ tag: T[k].label, dot: T[k].dot, tagBg: T[k].bg, tagFg: T[k].fg, meta,
      conf: conf + '%', confFg: conf < 90 ? '#A8551F' : '#1F7A4D', before, flag, after,
      flagBg: flag ? '#FBEBDD' : 'transparent', aria: 'Nội dung khối ' + T[k].label,
      border: sel ? '2px solid #1E4E8C' : '1px solid #E3E7EB', ring: sel ? '0 0 0 3px #E4ECF7' : 'none' });
    const blocks = [
      blk('I', 'Khối 1', 97, 'You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.', '', ''),
      blk('P', 'Khối 2 · Đoạn A', 94, 'In the decades after the Second World War, fruit trees quietly disappeared from many European and North American cities. Orchards that had once supplied neighbourhood ', 'rnarkets', ' were cleared for housing…'),
      blk('P', 'Khối 3 · Đoạn D', 88, 'A three-year study in one northern city found that, once washed, most fruit contained ', 'Iead', ' concentrations well below legal limits…'),
      blk('Q', 'Khối 4 · Câu 1–5 · True/False/Not Given', 86, '1  Fruit trees in parks were removed partly because fallen fruit was considered a ', 'probIem', '.', true),
      blk('Q', 'Khối 5 · Câu 6–10 · Matching Headings', 91, 'i  A resource rediscovered by volunteers   ii  The limits of urban food production   iii  Official concerns about upkeep…', '', ''),
      blk('A', 'Khối 6 · Đáp án (trang 11)', 89, '1 TRUE  2 NOT GIVEN  3 TRUE  4 NOT GIVEN  5 TRUE  6 ', 'i', '  7 iii  8 vi  9 v  10 ii')
    ];
    return { tags, lines, boxes, blocks };
  }
}
</script>
</body>
</html>
